<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Minimarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full mx-4">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center space-x-2">
        <span class="text-4xl">🛒</span>
        <span class="text-2xl font-bold text-green-700">Minimarket</span>
      </a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-8">
      <h1 class="text-2xl font-bold text-gray-800 text-center mb-6">Crear Cuenta</h1>

      <div id="register-error" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg mb-4"></div>

      <form id="register-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo</label>
          <input type="text" name="name" required placeholder="Juan Pérez" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" name="email" required placeholder="tu@email.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
          <input type="tel" name="phone" placeholder="+34 612 345 678" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input type="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
          <input type="password" name="confirmPassword" required minlength="6" placeholder="Repite tu contraseña" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none">
        </div>
        <label class="flex items-start">
          <input type="checkbox" required class="text-green-600 focus:ring-green-500 rounded mt-1">
          <span class="ml-2 text-sm text-gray-600">Acepto los <a href="terms.html" class="text-green-600 hover:text-green-700">términos y condiciones</a> y la <a href="privacy.html" class="text-green-600 hover:text-green-700">política de privacidad</a></span>
        </label>
        <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">Crear Cuenta</button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">¿Ya tienes cuenta? <a href="login.html" class="text-green-600 hover:text-green-700 font-medium">Inicia sesión</a></p>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (AuthManager.isLoggedIn()) {
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('register-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const errorDiv = document.getElementById('register-error');

        if (formData.get('password') !== formData.get('confirmPassword')) {
          errorDiv.textContent = 'Las contraseñas no coinciden';
          errorDiv.classList.remove('hidden');
          return;
        }

        const result = AuthManager.register({
          name: formData.get('name'),
          email: formData.get('email'),
          phone: formData.get('phone'),
          password: formData.get('password'),
          address: ''
        });

        if (result.success) {
          showToast('Cuenta creada exitosamente');
          setTimeout(() => window.location.href = 'index.html', 1000);
        } else {
          errorDiv.textContent = result.message;
          errorDiv.classList.remove('hidden');
        }
      });
    });
  </script>
</body>
</html>
