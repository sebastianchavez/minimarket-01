<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Minimarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
<meta name="currency" content="CLP">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full mx-4">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center space-x-2">
        <span class="text-4xl">🛒</span>
        <span class="text-2xl font-bold text-green-700">Minimarket</span>
      </a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-8">
      <h1 class="text-2xl font-bold text-gray-800 text-center mb-6">Iniciar Sesión</h1>

      <div id="login-error" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg mb-4"></div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" name="email" required placeholder="tu@email.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none">
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input type="checkbox" class="text-green-600 focus:ring-green-500 rounded">
            <span class="ml-2 text-sm text-gray-600">Recordarme</span>
          </label>
          <a href="forgot-password.html" class="text-sm text-green-600 hover:text-green-700">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">Iniciar Sesión</button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">¿No tienes cuenta? <a href="register.html" class="text-green-600 hover:text-green-700 font-medium">Regístrate</a></p>
      </div>

      <div class="mt-6 p-4 bg-gray-50 rounded-lg">
        <p class="text-xs text-gray-500 text-center">Demo: juan@email.com / 123456</p>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (AuthManager.isLoggedIn()) {
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const result = AuthManager.login(formData.get('email'), formData.get('password'));

        if (result.success) {
          showToast('Bienvenido, ' + result.user.name.split(' ')[0]);
          setTimeout(() => window.location.href = 'index.html', 1000);
        } else {
          const errorDiv = document.getElementById('login-error');
          errorDiv.textContent = result.message;
          errorDiv.classList.remove('hidden');
        }
      });
    });
  </script>
</body>
</html>
