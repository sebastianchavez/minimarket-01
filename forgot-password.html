<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - Minimarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
<meta name="currency" content="CLP">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full mx-4">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center space-x-2">
        <span class="text-4xl">🛒</span>
        <span class="text-2xl font-bold text-green-700">Minimarket</span>
      </a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-8">
      <div id="form-view">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-2">Recuperar Contraseña</h1>
        <p class="text-gray-600 text-center text-sm mb-6">Ingresa tu email y te enviaremos instrucciones para restablecer tu contraseña</p>

        <form id="forgot-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" required placeholder="tu@email.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none">
          </div>
          <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">Enviar Instrucciones</button>
        </form>
      </div>

      <div id="success-view" class="hidden text-center">
        <div class="text-5xl mb-4">📧</div>
        <h2 class="text-xl font-bold text-gray-800 mb-2">¡Email Enviado!</h2>
        <p class="text-gray-600 text-sm mb-6">Revisa tu bandeja de entrada para las instrucciones de recuperación.</p>
        <a href="login.html" class="text-green-600 hover:text-green-700 font-medium">Volver al inicio de sesión</a>
      </div>

      <div class="mt-6 text-center">
        <a href="login.html" class="text-sm text-gray-600 hover:text-green-600">← Volver al inicio de sesión</a>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('form-view').classList.add('hidden');
      document.getElementById('success-view').classList.remove('hidden');
    });
  </script>
</body>
</html>
