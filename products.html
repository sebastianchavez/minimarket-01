<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Minimarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
<meta name="currency" content="CLP">
</head>
<body class="bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Nuestros Productos</h1>
      <p class="text-gray-600 mt-1">Encuentra todo lo que necesitas</p>
    </div>

    <div class="flex flex-col lg:flex-row gap-8">
      <aside class="lg:w-64 shrink-0">
        <div class="bg-white rounded-xl p-6 shadow-sm sticky top-24">
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Buscar</label>
            <input type="text" id="search-input" placeholder="Buscar productos..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none">
          </div>

          <div class="mb-6">
            <h3 class="font-medium text-gray-800 mb-3">Categorías</h3>
            <div id="category-filters" class="space-y-2"></div>
          </div>

          <div class="mb-6">
            <h3 class="font-medium text-gray-800 mb-3">Precio</h3>
            <div class="space-y-2">
              <label class="flex items-center">
                <input type="radio" name="price" value="all" checked class="text-green-600 focus:ring-green-500"> 
                <span class="ml-2 text-sm text-gray-600">Todos</span>
              </label>
              <label class="flex items-center">
                <input type="radio" name="price" value="0-2" class="text-green-600 focus:ring-green-500"> 
                <span class="ml-2 text-sm text-gray-600">Hasta $2.000</span>
              </label>
              <label class="flex items-center">
                <input type="radio" name="price" value="2-5" class="text-green-600 focus:ring-green-500"> 
                <span class="ml-2 text-sm text-gray-600">$2.000 - $5.000</span>
              </label>
              <label class="flex items-center">
                <input type="radio" name="price" value="5+" class="text-green-600 focus:ring-green-500"> 
                <span class="ml-2 text-sm text-gray-600">Más de $5.000</span>
              </label>
            </div>
          </div>

          <div>
            <h3 class="font-medium text-gray-800 mb-3">Ordenar por</h3>
            <select id="sort-select" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none">
              <option value="name">Nombre A-Z</option>
              <option value="name-desc">Nombre Z-A</option>
              <option value="price-asc">Precio: menor a mayor</option>
              <option value="price-desc">Precio: mayor a menor</option>
              <option value="rating">Mejor valorados</option>
            </select>
          </div>
        </div>
      </aside>

      <div class="flex-1">
        <div class="flex items-center justify-between mb-4">
          <p id="results-count" class="text-sm text-gray-600"></p>
          <button id="clear-filters" class="text-sm text-green-600 hover:text-green-700 font-medium hidden">Limpiar filtros</button>
        </div>
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        <div id="no-results" class="hidden text-center py-16">
          <div class="text-6xl mb-4">🔍</div>
          <h3 class="text-xl font-semibold text-gray-800 mb-2">No se encontraron productos</h3>
          <p class="text-gray-600">Intenta con otros filtros o términos de búsqueda</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/products.js"></script>
</body>
</html>
